# Hologram Fraud Detection Configuration

# ============== Model Settings ==============
# model:
#   type: "vae"  # Options: transformer, gru, hybrid, vae
#   feature_dim: 320
#   hidden_dim: 200
#   latent_dim: 4
#   num_layers: 4
#   num_heads: 5
#   dropout: 0.1
#   max_seq_len: 10

model:
  type: "transformer"  # Options: transformer, gru, hybrid, vae
  # feature_dim: 320
  feature_dim: 384
  hidden_dim: 200
  latent_dim: 4
  num_layers: 4
  num_heads: 4
  # dropout: 0.1
  max_seq_len: 10

# ============== Training Settings ==============
training:
  lr: 0.0001
  num_epochs: 300
  batch_size: 32
  seed: 0
  max_grad_norm: 1.0
  patience: 40
  min_delta: 0.001

# ============== Loss Settings ==============
loss:
  alpha: 1.0      # MSE weight
  beta: 1.0       # Cosine weight  
  gamma: 0.2      # KL weight
  kl_warmup: 50   # Epochs for KL annealing
  eps: 1e-8       # Numerical stability

# ============== Data Settings ==============
data:
  seq_len: 10
  sequences_step: 5
  min_similarity: 0.1
  sample_seq_prob: 0.01
  flat_prob: 0.02
  validation_batch_size: 64

# ============== Masking Settings ==============
masking:
  strategy: "seq_mask"  # Options: seq_mask, bert_mask, modulo_mask
  mask_prob: 0.15
  len_hide: 5
  num_masks: 2
  noise_std: 0.1

projector:
  model_path: ""
  backbone_name: "vit_small_patch14_reg4_dinov2"
  pretrained: true 
  num_classes: -1
  dynamic_img_size: true

# ============== Paths ==============
paths:
  data_dir: "./data/"
  checkpoint_dir: "./checkpoints/"
  log_dir: "./logs/"
  # backbone_path: "data_splits/notebooks/other/model_kornia/k0.ckpt"
  backbone_path: ""
  predata_dir: "datasets/midv-dynattack/"
  splits_dir: "data_splits/data/splits_kfold_s0/k0/simple"

# ============== Device ==============
device: "cuda"

# ============== NAME ===============
run_name: "dinov2_k0_full"
# run_name: "korniak0"